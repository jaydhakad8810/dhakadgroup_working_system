name: Deploy Frontends
on:
  push:
    branches: [main]
    paths:
      - 'admin-panel/**'
      - 'supervisor-pwa/**'
      - 'driver-pwa/**'
      - 'landing/**'
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: '18'
      - name: Build Admin Panel
        working-directory: ./admin-panel
        run: |
          echo "module.exports = { plugins: { tailwindcss: {}, autoprefixer: {} } }" > postcss.config.js
          npm install
          npm run build
      - name: Build Supervisor PWA
        working-directory: ./supervisor-pwa
        run: |
          echo "module.exports = { plugins: { tailwindcss: {}, autoprefixer: {} } }" > postcss.config.js
          npm install
          npm run build
      - name: Build Driver PWA
        working-directory: ./driver-pwa
        run: |
          echo "module.exports = { plugins: { tailwindcss: {}, autoprefixer: {} } }" > postcss.config.js
          npm install
          npm run build
      - name: Deploy to VPS
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /var/www/dgsystem
            git pull origin main
      - name: Upload Admin Panel
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "admin-panel/dist/*"
          target: "/var/www/dgsystem/admin-panel/dist"
          strip_components: 2
      - name: Upload Supervisor PWA
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "supervisor-pwa/dist/*"
          target: "/var/www/dgsystem/supervisor-pwa/dist"
          strip_components: 2
      - name: Upload Driver PWA
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "driver-pwa/dist/*"
          target: "/var/www/dgsystem/driver-pwa/dist"
          strip_components: 2
      - name: Reload Nginx
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: systemctl reload nginx && echo "Frontends deployed"
