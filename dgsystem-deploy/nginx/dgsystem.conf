# ═══════════════════════════════════════════════════════════════
# NGINX CONFIG FOR DGSYSTEM ON HOSTINGER VPS
# File: /etc/nginx/sites-available/dgsystem
# ═══════════════════════════════════════════════════════════════

# ── 1. dhakadgroup.in → Landing Page ───────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name dhakadgroup.in www.dhakadgroup.in;

    # Redirect HTTP → HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name dhakadgroup.in www.dhakadgroup.in;

    ssl_certificate     /etc/letsencrypt/live/dhakadgroup.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dhakadgroup.in/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    root /var/www/html;
    index index.html;

    # Serve landing page
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Gzip
    gzip on;
    gzip_types text/html text/css application/javascript;
}


# ── 2. admin.dhakadgroup.in → Admin Panel ──────────────────────
server {
    listen 80;
    server_name admin.dhakadgroup.in;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name admin.dhakadgroup.in;

    ssl_certificate     /etc/letsencrypt/live/admin.dhakadgroup.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.dhakadgroup.in/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    root /var/www/dgsystem/admin/dist;
    index index.html;

    # React Router — serve index.html for all routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|svg|ico|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/html text/css application/javascript application/json;
}


# ── 3. supervisor.dhakadgroup.in → Supervisor PWA ──────────────
server {
    listen 80;
    server_name supervisor.dhakadgroup.in;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name supervisor.dhakadgroup.in;

    ssl_certificate     /etc/letsencrypt/live/supervisor.dhakadgroup.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/supervisor.dhakadgroup.in/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    root /var/www/dgsystem/supervisor/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # PWA Service Worker — no cache
    location /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires 0;
    }

    location ~* \.(js|css|png|jpg|svg|ico|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/html text/css application/javascript;
}


