# ── 5. api.dhakadgroup.in → Node.js Backend ────────────────────
server {
    listen 80;
    server_name api.dhakadgroup.in;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name api.dhakadgroup.in;

    ssl_certificate     /etc/letsencrypt/live/api.dhakadgroup.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.dhakadgroup.in/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Proxy to Node.js on port 5000
    location / {
        proxy_pass         http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 300s;
        client_max_body_size 50m;
    }

    # WebSocket for Socket.io
    location /socket.io/ {
        proxy_pass         http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
    }
}
